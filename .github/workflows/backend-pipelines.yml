name: backend CI

on:
  push:
    branches: [main, dev]
  merge_group:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependince
        run: npm ci

      - name: Run test
        run: npm run test:run

      - name: Build test
        run: npm run build
